<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartMotor – Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body{margin:0}
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-track{background:#0f172a}
    ::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
  </style>
</head>
<body class="bg-slate-950 text-white">
<div id="root"></div>
<script type="text/babel">

const PAGES = [
  { label:"Dashboard",  icon:"🏠", href:"dashboard.html" },
  { label:"Real-Time",  icon:"📡", href:"realtime.html"  },
  { label:"Analytics",  icon:"📊", href:"analytics.html" },
  { label:"Alerts",     icon:"🔔", href:"alerts.html"    },
  { label:"Settings",   icon:"⚙️", href:"settings.html"  },
];

function Sidebar({ active }) {
  return (
    <aside className="w-64 bg-slate-900 border-r border-slate-800 p-5 flex flex-col shrink-0">
      <h1 className="text-2xl font-bold text-blue-500 mb-10">SMARTMOTOR</h1>
      <ul className="space-y-2 flex-1">
        {PAGES.map(p => (
          <li key={p.label}>
            <a href={p.href}
              className={`flex items-center gap-2 p-3 rounded-xl transition-all duration-200
                ${active === p.label
                  ? "bg-blue-500/20 text-blue-400 border border-blue-500/30"
                  : "hover:bg-slate-800 text-slate-400"}`}>
              <span>{p.icon}</span>{p.label}
            </a>
          </li>
        ))}
      </ul>
      <div className="text-xs text-slate-600">v1.0.0 · Awaiting Connection</div>
    </aside>
  );
}

function Navbar({ title }) {
  return (
    <nav className="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 shrink-0">
      <h2 className="text-xl font-semibold">{title}</h2>
      <div className="flex items-center gap-2">
        <div className="w-2.5 h-2.5 rounded-full bg-slate-600"></div>
        <span className="text-slate-400 text-sm">Offline</span>
      </div>
    </nav>
  );
}

function StatCard({ label, icon }) {
  return (
    <div className="bg-slate-900 rounded-2xl border border-slate-800 p-5">
      <div className="flex justify-between items-start mb-4">
        <p className="text-slate-400 text-sm">{label}</p>
        <span className="text-xl">{icon}</span>
      </div>
      <div className="space-y-2">
        {["Average","Peak","Lowest"].map(s => (
          <div key={s} className="flex justify-between items-center">
            <span className="text-slate-500 text-xs">{s}</span>
            <span className="text-slate-600 font-semibold text-sm">--</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function EmptyChartBox({ label, height = "h-56" }) {
  return (
    <div className="bg-slate-900 rounded-2xl border border-slate-800 p-5">
      <h3 className="text-slate-300 font-semibold mb-3">{label}</h3>
      <div className={`${height} flex flex-col items-center justify-center gap-2 border border-dashed border-slate-700 rounded-xl`}>
        <span className="text-3xl">📊</span>
        <p className="text-slate-500 text-sm">No analytics data yet</p>
        <p className="text-slate-600 text-xs">Connect sensors to populate charts</p>
      </div>
    </div>
  );
}

function AnalyticsPage() {
  const [range, setRange] = React.useState("1H");
  const ranges = ["1H","6H","24H","7D","30D"];

  return (
    <section className="p-6 space-y-6">
      {/* Range Selector */}
      <div className="flex items-center justify-between">
        <p className="text-slate-400 text-sm">Select time range to view historical data</p>
        <div className="flex gap-2">
          {ranges.map(r => (
            <button key={r} onClick={() => setRange(r)}
              className={`px-3 py-1 rounded-lg text-sm transition ${range === r ? "bg-blue-500 text-white" : "bg-slate-800 text-slate-400 hover:bg-slate-700"}`}>
              {r}
            </button>
          ))}
        </div>
      </div>

      {/* Stat Summary Cards */}
      <div className="grid grid-cols-4 gap-6">
        <StatCard label="Temperature" icon="🌡️"/>
        <StatCard label="RPM Speed"   icon="⚙️"/>
        <StatCard label="Voltage"     icon="⚡"/>
        <StatCard label="Vibration"   icon="📳"/>
      </div>

      {/* Main Chart */}
      <EmptyChartBox label="Sensor Overview Chart" height="h-64"/>

      {/* Two smaller charts */}
      <div className="grid grid-cols-2 gap-6">
        <EmptyChartBox label="Temperature Trend"/>
        <EmptyChartBox label="Vibration Trend"/>
      </div>
    </section>
  );
}

function App() {
  return (
    <div className="flex h-screen overflow-hidden">
      <Sidebar active="Analytics"/>
      <main className="flex-1 flex flex-col overflow-hidden">
        <Navbar title="Analytics"/>
        <div className="flex-1 overflow-y-auto"><AnalyticsPage/></div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
