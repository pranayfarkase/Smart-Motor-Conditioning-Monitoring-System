<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartMotor – Real-Time</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body{margin:0}
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-track{background:#0f172a}
    ::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
  </style>
</head>
<body class="bg-slate-950 text-white">
<div id="root"></div>
<script type="text/babel">

const PAGES = [
  { label:"Dashboard",  icon:"🏠", href:"dashboard.html" },
  { label:"Real-Time",  icon:"📡", href:"realtime.html"  },
  { label:"Analytics",  icon:"📊", href:"analytics.html" },
  { label:"Alerts",     icon:"🔔", href:"alerts.html"    },
  { label:"Settings",   icon:"⚙️", href:"settings.html"  },
];

function Sidebar({ active }) {
  return (
    <aside className="w-64 bg-slate-900 border-r border-slate-800 p-5 flex flex-col shrink-0">
      <h1 className="text-2xl font-bold text-blue-500 mb-10">SMARTMOTOR</h1>
      <ul className="space-y-2 flex-1">
        {PAGES.map(p => (
          <li key={p.label}>
            <a href={p.href}
              className={`flex items-center gap-2 p-3 rounded-xl transition-all duration-200
                ${active === p.label
                  ? "bg-blue-500/20 text-blue-400 border border-blue-500/30"
                  : "hover:bg-slate-800 text-slate-400"}`}>
              <span>{p.icon}</span>{p.label}
            </a>
          </li>
        ))}
      </ul>
      <div className="text-xs text-slate-600">v1.0.0 · Awaiting Connection</div>
    </aside>
  );
}

function Navbar({ title }) {
  return (
    <nav className="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 shrink-0">
      <h2 className="text-xl font-semibold">{title}</h2>
      <div className="flex items-center gap-2">
        <div className="w-2.5 h-2.5 rounded-full bg-slate-600"></div>
        <span className="text-slate-400 text-sm">Offline</span>
      </div>
    </nav>
  );
}

function StreamCard({ label, icon, color }) {
  return (
    <div className="bg-slate-900 rounded-2xl border border-slate-800 p-5">
      <div className="flex items-center gap-2 mb-4">
        <span className="text-xl">{icon}</span>
        <h3 className="text-slate-300 font-semibold">{label}</h3>
        <span className={`ml-auto text-xs px-2 py-0.5 rounded-full bg-slate-800 ${color}`}>LIVE</span>
      </div>

      {/* Live value display */}
      <div className="flex items-end gap-2 mb-4">
        <span className="text-4xl font-bold text-slate-600">--</span>
        <span className="text-slate-500 mb-1 text-sm">waiting...</span>
      </div>

      {/* Empty chart area */}
      <div className="h-32 flex flex-col items-center justify-center gap-1 border border-dashed border-slate-700 rounded-xl">
        <span className="text-2xl">📡</span>
        <p className="text-slate-600 text-xs">No stream data</p>
      </div>

      {/* Stats row */}
      <div className="grid grid-cols-3 gap-2 mt-4">
        {["Min","Max","Avg"].map(s => (
          <div key={s} className="bg-slate-800 rounded-xl p-2 text-center">
            <p className="text-slate-500 text-xs">{s}</p>
            <p className="text-slate-600 font-semibold text-sm">--</p>
          </div>
        ))}
      </div>
    </div>
  );
}

function RealTimePage() {
  return (
    <section className="p-6 space-y-6">
      {/* Status Banner */}
      <div className="bg-slate-900 border border-slate-700 rounded-2xl p-4 flex items-center gap-3">
        <div className="w-3 h-3 rounded-full bg-slate-600"></div>
        <p className="text-slate-400 text-sm">Real-time stream is <span className="text-slate-500 font-semibold">inactive</span>. Connect your sensors to begin live monitoring.</p>
      </div>

      {/* Stream Cards Grid */}
      <div className="grid grid-cols-2 gap-6">
        <StreamCard label="Temperature"  icon="🌡️" color="text-orange-400"/>
        <StreamCard label="RPM Speed"    icon="⚙️" color="text-blue-400"/>
        <StreamCard label="Voltage"      icon="⚡" color="text-purple-400"/>
        <StreamCard label="Vibration"    icon="📳" color="text-pink-400"/>
      </div>
    </section>
  );
}

function App() {
  return (
    <div className="flex h-screen overflow-hidden">
      <Sidebar active="Real-Time"/>
      <main className="flex-1 flex flex-col overflow-hidden">
        <Navbar title="Real-Time Monitor"/>
        <div className="flex-1 overflow-y-auto"><RealTimePage/></div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
