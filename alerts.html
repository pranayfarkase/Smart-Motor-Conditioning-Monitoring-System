<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartMotor – Alerts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body{margin:0}
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-track{background:#0f172a}
    ::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
  </style>
</head>
<body class="bg-slate-950 text-white">
<div id="root"></div>
<script type="text/babel">

const PAGES = [
  { label:"Dashboard",  icon:"🏠", href:"dashboard.html" },
  { label:"Real-Time",  icon:"📡", href:"realtime.html"  },
  { label:"Analytics",  icon:"📊", href:"analytics.html" },
  { label:"Alerts",     icon:"🔔", href:"alerts.html"    },
  { label:"Settings",   icon:"⚙️", href:"settings.html"  },
];

function Sidebar({ active }) {
  return (
    <aside className="w-64 bg-slate-900 border-r border-slate-800 p-5 flex flex-col shrink-0">
      <h1 className="text-2xl font-bold text-blue-500 mb-10">SMARTMOTOR</h1>
      <ul className="space-y-2 flex-1">
        {PAGES.map(p => (
          <li key={p.label}>
            <a href={p.href}
              className={`flex items-center gap-2 p-3 rounded-xl transition-all duration-200
                ${active === p.label
                  ? "bg-blue-500/20 text-blue-400 border border-blue-500/30"
                  : "hover:bg-slate-800 text-slate-400"}`}>
              <span>{p.icon}</span>{p.label}
            </a>
          </li>
        ))}
      </ul>
      <div className="text-xs text-slate-600">v1.0.0 · Awaiting Connection</div>
    </aside>
  );
}

function Navbar({ title }) {
  return (
    <nav className="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 shrink-0">
      <h2 className="text-xl font-semibold">{title}</h2>
      <div className="flex items-center gap-2">
        <div className="w-2.5 h-2.5 rounded-full bg-slate-600"></div>
        <span className="text-slate-400 text-sm">Offline</span>
      </div>
    </nav>
  );
}

function AlertsPage() {
  const [filter, setFilter] = React.useState("All");
  const [alerts, setAlerts] = React.useState([]);
  const filters = ["All","Critical","Warning","Info"];

  const levelStyle = {
    Critical: "bg-red-500/20 border-red-500/40 text-red-300",
    Warning:  "bg-yellow-500/20 border-yellow-500/40 text-yellow-300",
    Info:     "bg-blue-500/20 border-blue-500/40 text-blue-300",
  };

  const filtered = filter === "All" ? alerts : alerts.filter(a => a.level === filter);

  return (
    <section className="p-6 space-y-6">
      {/* Summary Cards */}
      <div className="grid grid-cols-3 gap-6">
        {[
          { label:"Critical Alerts", color:"text-red-400",    border:"border-red-500/30",    icon:"🔴" },
          { label:"Warnings",        color:"text-yellow-400", border:"border-yellow-500/30", icon:"🟡" },
          { label:"Info",            color:"text-blue-400",   border:"border-blue-500/30",   icon:"🔵" },
        ].map(c => (
          <div key={c.label} className={`bg-slate-900 rounded-2xl border ${c.border} p-5`}>
            <div className="flex justify-between items-center">
              <p className={`font-semibold ${c.color}`}>{c.label}</p>
              <span className="text-xl">{c.icon}</span>
            </div>
            <p className="text-3xl font-bold text-slate-600 mt-2">0</p>
          </div>
        ))}
      </div>

      {/* Filter Tabs + Alert List */}
      <div className="bg-slate-900 rounded-2xl border border-slate-800 p-6">
        <div className="flex items-center justify-between mb-5">
          <h2 className="text-lg font-semibold text-red-400">Alert Log</h2>
          <div className="flex gap-2">
            {filters.map(f => (
              <button key={f} onClick={() => setFilter(f)}
                className={`px-3 py-1 rounded-lg text-sm transition ${filter === f ? "bg-blue-500 text-white" : "bg-slate-800 text-slate-400 hover:bg-slate-700"}`}>
                {f}
              </button>
            ))}
          </div>
        </div>

        {filtered.length === 0 ? (
          <div className="flex flex-col items-center justify-center py-16 gap-3">
            <span className="text-4xl">✅</span>
            <p className="text-slate-400 font-medium">No alerts found</p>
            <p className="text-slate-600 text-sm">Alerts will appear here when sensors report issues</p>
          </div>
        ) : (
          <div className="space-y-3">
            {filtered.map(a => (
              <div key={a.id} className={`flex justify-between items-center p-4 rounded-xl border ${levelStyle[a.level]}`}>
                <div>
                  <p className="font-medium">{a.msg}</p>
                  <p className="text-xs text-slate-400 mt-1">{a.time}</p>
                </div>
                <button onClick={() => setAlerts(prev => prev.filter(x => x.id !== a.id))}
                  className="text-slate-400 hover:text-white px-3 py-1 rounded-lg bg-slate-800 text-sm">
                  Dismiss
                </button>
              </div>
            ))}
          </div>
        )}
      </div>
    </section>
  );
}

function App() {
  return (
    <div className="flex h-screen overflow-hidden">
      <Sidebar active="Alerts"/>
      <main className="flex-1 flex flex-col overflow-hidden">
        <Navbar title="Alerts"/>
        <div className="flex-1 overflow-y-auto"><AlertsPage/></div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
