<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartMotor – Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body{margin:0}
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-track{background:#0f172a}
    ::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
  </style>
</head>
<body class="bg-slate-950 text-white">
<div id="root"></div>
<script type="text/babel">

const PAGES = [
  { label:"Dashboard",  icon:"🏠", href:"dashboard.html" },
  { label:"Real-Time",  icon:"📡", href:"realtime.html"  },
  { label:"Analytics",  icon:"📊", href:"analytics.html" },
  { label:"Alerts",     icon:"🔔", href:"alerts.html"    },
  { label:"Settings",   icon:"⚙️", href:"settings.html"  },
];

function Sidebar({ active }) {
  return (
    <aside className="w-64 bg-slate-900 border-r border-slate-800 p-5 flex flex-col shrink-0">
      <h1 className="text-2xl font-bold text-blue-500 mb-10">SMARTMOTOR</h1>
      <ul className="space-y-2 flex-1">
        {PAGES.map(p => (
          <li key={p.label}>
            <a href={p.href}
              className={`flex items-center gap-2 p-3 rounded-xl transition-all duration-200
                ${active === p.label
                  ? "bg-blue-500/20 text-blue-400 border border-blue-500/30"
                  : "hover:bg-slate-800 text-slate-400"}`}>
              <span>{p.icon}</span>{p.label}
            </a>
          </li>
        ))}
      </ul>
      <div className="text-xs text-slate-600">v1.0.0 · Awaiting Connection</div>
    </aside>
  );
}

function Navbar({ title }) {
  return (
    <nav className="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 shrink-0">
      <h2 className="text-xl font-semibold">{title}</h2>
      <div className="flex items-center gap-2">
        <div className="w-2.5 h-2.5 rounded-full bg-slate-600"></div>
        <span className="text-slate-400 text-sm">Offline</span>
      </div>
    </nav>
  );
}

function Toggle({ value, onChange }) {
  return (
    <button onClick={() => onChange(!value)}
      className={`w-12 h-6 rounded-full transition-colors relative ${value ? "bg-blue-500" : "bg-slate-700"}`}>
      <span className={`absolute top-1 w-4 h-4 bg-white rounded-full transition-all ${value ? "left-7" : "left-1"}`}></span>
    </button>
  );
}

function Section({ title, children }) {
  return (
    <div className="bg-slate-900 rounded-2xl border border-slate-800 p-6 space-y-5">
      <h3 className="text-slate-300 font-semibold border-b border-slate-800 pb-3">{title}</h3>
      {children}
    </div>
  );
}

function Row({ label, sub, children }) {
  return (
    <div className="flex justify-between items-center">
      <div>
        <p className="text-slate-300 text-sm">{label}</p>
        {sub && <p className="text-slate-600 text-xs mt-0.5">{sub}</p>}
      </div>
      {children}
    </div>
  );
}

function SettingsPage() {
  const [interval,  setInterval]  = React.useState(2);
  const [notif,     setNotif]     = React.useState(true);
  const [autoRecon, setAutoRecon] = React.useState(true);
  const [darkMode,  setDarkMode]  = React.useState(true);
  const [endpoint,  setEndpoint]  = React.useState("");
  const [saved,     setSaved]     = React.useState(false);

  const save = () => {
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  return (
    <section className="p-6 space-y-6 max-w-2xl">

      {/* Connection */}
      <Section title="🔌 Connection">
        <Row label="WebSocket Endpoint" sub="Your IoT data source URL">
          <input value={endpoint} onChange={e => setEndpoint(e.target.value)}
            placeholder="ws://your-iot-endpoint"
            className="w-72 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-blue-500"/>
        </Row>
        <Row label="Auto Reconnect" sub="Reconnect automatically on disconnect">
          <Toggle value={autoRecon} onChange={setAutoRecon}/>
        </Row>
        <Row label="Update Interval" sub={`Refresh every ${interval}s`}>
          <div className="flex items-center gap-3">
            <input type="range" min="1" max="10" value={interval}
              onChange={e => setInterval(+e.target.value)}
              className="w-28 accent-blue-500"/>
            <span className="text-blue-400 w-6 text-center text-sm">{interval}s</span>
          </div>
        </Row>
      </Section>

      {/* Notifications */}
      <Section title="🔔 Notifications">
        <Row label="Alert Notifications" sub="Show alerts when thresholds are exceeded">
          <Toggle value={notif} onChange={setNotif}/>
        </Row>
        <Row label="Critical Threshold – Temperature" sub="Alert when temperature exceeds limit">
          <input type="number" placeholder="e.g. 100"
            className="w-24 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-blue-500"/>
        </Row>
        <Row label="Critical Threshold – Vibration" sub="Alert when vibration exceeds limit">
          <input type="number" placeholder="e.g. 7"
            className="w-24 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-blue-500"/>
        </Row>
      </Section>

      {/* Appearance */}
      <Section title="🎨 Appearance">
        <Row label="Dark Mode" sub="Use dark theme across the dashboard">
          <Toggle value={darkMode} onChange={setDarkMode}/>
        </Row>
      </Section>

      {/* Save */}
      <button onClick={save}
        className={`w-full py-3 rounded-xl font-semibold transition ${saved ? "bg-green-500" : "bg-blue-500 hover:bg-blue-600"}`}>
        {saved ? "✓ Saved!" : "Save Settings"}
      </button>

    </section>
  );
}

function App() {
  return (
    <div className="flex h-screen overflow-hidden">
      <Sidebar active="Settings"/>
      <main className="flex-1 flex flex-col overflow-hidden">
        <Navbar title="Settings"/>
        <div className="flex-1 overflow-y-auto"><SettingsPage/></div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
