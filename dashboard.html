<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartMotor – Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body{margin:0}
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-track{background:#0f172a}
    ::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
  </style>
</head>
<body class="bg-slate-950 text-white">
<div id="root"></div>
<script type="text/babel">

const PAGES = [
  { label:"Dashboard",  icon:"🏠", href:"dashboard.html" },
  { label:"Real-Time",  icon:"📡", href:"realtime.html"  },
  { label:"Analytics",  icon:"📊", href:"analytics.html" },
  { label:"Alerts",     icon:"🔔", href:"alerts.html"    },
  { label:"Settings",   icon:"⚙️", href:"settings.html"  },
];

function Sidebar({ active }) {
  return (
    <aside className="w-64 bg-slate-900 border-r border-slate-800 p-5 flex flex-col shrink-0">
      <h1 className="text-2xl font-bold text-blue-500 mb-10">SMARTMOTOR</h1>
      <ul className="space-y-2 flex-1">
        {PAGES.map(p => (
          <li key={p.label}>
            <a href={p.href}
              className={`flex items-center gap-2 p-3 rounded-xl transition-all duration-200
                ${active === p.label
                  ? "bg-blue-500/20 text-blue-400 border border-blue-500/30"
                  : "hover:bg-slate-800 text-slate-400"}`}>
              <span>{p.icon}</span>{p.label}
            </a>
          </li>
        ))}
      </ul>
      <div className="text-xs text-slate-600">v1.0.0 · Awaiting Connection</div>
    </aside>
  );
}

function Navbar({ title }) {
  return (
    <nav className="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 shrink-0">
      <h2 className="text-xl font-semibold">{title}</h2>
      <div className="flex items-center gap-2">
        <div className="w-2.5 h-2.5 rounded-full bg-slate-600"></div>
        <span className="text-slate-400 text-sm">Offline</span>
      </div>
    </nav>
  );
}

// ── Shared components ────────────────────────────────────────────────────────
function SensorCard({ label, unit, icon }) {
  return (
    <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800 hover:scale-105 transition-transform duration-200">
      <div className="flex justify-between items-start mb-3">
        <p className="text-slate-400 text-sm">{label}</p>
        <span className="text-2xl">{icon}</span>
      </div>
      <p className="text-3xl font-bold text-slate-600">--</p>
      <p className="text-xs text-slate-600 mt-2">Awaiting data...</p>
    </div>
  );
}

function EmptyChart({ label }) {
  return (
    <div className="bg-slate-900 rounded-2xl border border-slate-800 p-5">
      <h3 className="text-slate-300 font-semibold mb-3">{label}</h3>
      <div className="h-48 flex flex-col items-center justify-center gap-2 border border-dashed border-slate-700 rounded-xl">
        <span className="text-3xl">📡</span>
        <p className="text-slate-500 text-sm">No data received yet</p>
        <p className="text-slate-600 text-xs">Connect your sensor to start streaming</p>
      </div>
    </div>
  );
}

function HealthGauge() {
  return (
    <div className="flex flex-col items-center justify-center h-full gap-2">
      <svg width="150" height="150" viewBox="0 0 150 150">
        <circle cx="75" cy="75" r="60" fill="none" stroke="#1e293b" strokeWidth="10"/>
        <text x="75" y="70" textAnchor="middle" fill="#475569" fontSize="16" fontWeight="bold">--</text>
        <text x="75" y="90" textAnchor="middle" fill="#475569" fontSize="12">No Data</text>
      </svg>
      <p className="text-slate-600 text-xs">Awaiting sensor feed</p>
    </div>
  );
}

// ── Dashboard Page ───────────────────────────────────────────────────────────
function DashboardPage() {
  const [devices, setDevices] = React.useState([
    { id:1, name:"Temperature Sensor", online:false },
    { id:2, name:"Voltage Sensor",     online:false },
    { id:3, name:"Vibration Sensor",   online:false },
    { id:4, name:"RPM Sensor",         online:false },
  ]);
  const toggle = id => setDevices(d => d.map(x => x.id===id ? {...x, online:!x.online} : x));

  return (
    <section className="p-6 space-y-6">
      {/* Sensor Cards */}
      <div className="grid grid-cols-4 gap-6">
        <SensorCard label="Temperature" unit="°C"   icon="🌡️"/>
        <SensorCard label="RPM Speed"   unit="rpm"  icon="⚙️"/>
        <SensorCard label="Voltage"     unit="V"    icon="⚡"/>
        <SensorCard label="Vibration"   unit="mm/s" icon="📳"/>
      </div>

      {/* Charts */}
      <div className="grid grid-cols-2 gap-6">
        <EmptyChart label="Temperature Graph"/>
        <EmptyChart label="Vibration Graph"/>
      </div>

      {/* Bottom Row */}
      <div className="grid grid-cols-3 gap-6">
        {/* Motor Health */}
        <div className="bg-slate-900 rounded-2xl border border-slate-800 p-6">
          <h2 className="text-xl font-semibold mb-2">Motor Health</h2>
          <HealthGauge/>
        </div>

        {/* Alerts */}
        <div className="bg-slate-900 rounded-2xl border border-red-500/30 p-6">
          <h2 className="text-xl font-semibold text-red-400 mb-4">Alerts</h2>
          <div className="flex flex-col items-center justify-center py-6 gap-2">
            <span className="text-2xl">✅</span>
            <p className="text-slate-600 text-sm">No alerts at this time</p>
          </div>
        </div>

        {/* Devices */}
        <div className="bg-slate-900 rounded-2xl border border-slate-800 p-6">
          <h2 className="text-xl font-semibold mb-4">Connected Devices</h2>
          <div className="space-y-3">
            {devices.map(d => (
              <div key={d.id} className="flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className={`w-3 h-3 rounded-full ${d.online ? "bg-green-500 animate-pulse" : "bg-slate-600"}`}></div>
                  <span className="text-sm text-slate-300">{d.name}</span>
                </div>
                <button onClick={() => toggle(d.id)}
                  className={`text-xs px-2 py-1 rounded-lg transition ${d.online ? "bg-red-500/20 text-red-400 hover:bg-red-500/40" : "bg-green-500/20 text-green-400 hover:bg-green-500/40"}`}>
                  {d.online ? "Disconnect" : "Connect"}
                </button>
              </div>
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}

function App() {
  return (
    <div className="flex h-screen overflow-hidden">
      <Sidebar active="Dashboard"/>
      <main className="flex-1 flex flex-col overflow-hidden">
        <Navbar title="Dashboard"/>
        <div className="flex-1 overflow-y-auto"><DashboardPage/></div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
